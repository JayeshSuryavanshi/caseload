[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caseload"
version = "0.1.0"
description = "Reinforcement learning environments for budgeted fraud investigation under selective labels and regime drift"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Jayesh Suryavanshi", email = "jayeshksuryavanshi@gmail.com" }]
keywords = ["reinforcement-learning", "fraud-detection", "selective-labels", "monitored-mdp", "gymnasium"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "gymnasium>=0.29",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
agents = ["torch>=2.1"]
fifar = ["pandas>=2.0", "pyarrow>=14"]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/JayeshSuryavanshi/caseload"
Issues = "https://github.com/JayeshSuryavanshi/caseload/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/caseload"]

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
